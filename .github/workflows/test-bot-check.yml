name: Test bot check logic
on:
  workflow_dispatch:
    inputs:
      pr_number:
        type: string
        description: PR number to check
        required: true

permissions:
  contents: read
  pull-requests: read

env:
  GITHUB_BOT_NAME: 'jm-commerce-bot[bot]'

jobs:
  test-bot-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check if PR was created by bot
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ inputs.pr_number }}
            });
            const author = pr.data.user.login;
            console.log(`PR #${{ inputs.pr_number }} was created by: ${author}`);
            if (author === '${{ env.GITHUB_BOT_NAME }}') {
              core.setFailed(`PR was created by ${author} (bot) — skipping cherry-pick to prevent loop`);
            } else {
              console.log(`PR was created by a human (${author}) — would proceed with cherry-pick`);
            }
