name: Test bot check logic
on:
  push:
    branches:
      - 'fix/SYM-7401_fix_cherry_pick_loop_with_test'

permissions:
  contents: read
  pull-requests: read

env:
  GITHUB_BOT_NAME: 'jumpmind-commerce-bot[bot]'

jobs:
  test-human-pr:
    name: "Test human PR (#557 - should pass)"
    runs-on: ubuntu-latest
    steps:
      - name: Check if PR was created by bot
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: 557
            });
            const author = pr.data.user.login;
            console.log(`PR #557 was created by: ${author}`);
            if (author === '${{ env.GITHUB_BOT_NAME }}') {
              core.setFailed(`PR was created by ${author} (bot) — skipping cherry-pick to prevent loop`);
            } else {
              console.log(`PR was created by a human (${author}) — would proceed with cherry-pick`);
            }

  test-bot-pr:
    name: "Test bot PR (#590 - should fail)"
    runs-on: ubuntu-latest
    steps:
      - name: Check if PR was created by bot
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: 590
            });
            const author = pr.data.user.login;
            console.log(`PR #590 was created by: ${author}`);
            if (author === '${{ env.GITHUB_BOT_NAME }}') {
              core.setFailed(`PR was created by ${author} (bot) — skipping cherry-pick to prevent loop`);
            } else {
              console.log(`PR was created by a human (${author}) — would proceed with cherry-pick`);
            }
