# Set the DB connection pool type.
# Options include: "dbcp2" for Apache DBCP2, and "hikari" for HikariCP.
# Apache DBCP2 is the default. HikariCP is included in the SymmetricDS 
# distribution and requires no additional dependencies.
# Tags: database
# Type: string
db.pool.type=dbcp2

# Maximum lifetime (ms) of a connection in the pool (HikariCP only).
#
# An in-use connection will never be retired; it is removed only after it is closed and returned to the pool.
# On a connection-by-connection basis, minor negative attenuation is applied to avoid mass-extinction in the pool.
# It is strongly recommended to set this value, and it should be at least several seconds shorter than any database
# or infrastructure imposed connection time limit. A value of 0 indicates no maximum lifetime (infinite lifetime),
# subject to db.pool.idle.timeout.millis. The minimum allowed value is 30000 ms (30 seconds).
# Default: 1800000 ms (30 minutes)
# Tags: database
# Type: integer
db.pool.max.lifetime.millis=1800000

# Maximum time (ms) a connection is allowed to sit idle in the pool (HikariCP only).
#
# This setting only applies when db.pool.min.idle is less than db.pool.max.active. Idle connections will not
# be retired once the pool reaches the minimum idle count. Whether a connection is retired as idle is subject
# to a maximum variation of +30 seconds and an average variation of +15 seconds. A connection will never be
# retired before this timeout elapses. A value of 0 means idle connections are never removed from the pool.
# The minimum allowed value is 10000 ms (10 seconds). Default: 600000 ms (10 minutes).
# Tags: database
# Type: integer
db.pool.idle.timeout.millis=600000

# Controls how frequently the pool will attempt to keep a connection alive to prevent it from being
# timed out by the database or network infrastructure, in milliseconds. For HikariCP: this value must
# be less than the maxLifetime value. A keepalive will only occur on an idle connection. When the time
# arrives for a keepalive against a given connection, that connection will be removed from the pool,
# pinged, and then returned to the pool. The ping is one of either: invocation of the JDBC4 isValid()
# method, or execution of the connectionTestQuery. Typically, the duration out-of-the-pool should be
# measured in single digit milliseconds or even sub-millisecond, and therefore should have little or no
# noticeable performance impact. The minimum allowed value is 30000 (30 seconds), but a value in the
# range of minutes is most desirable. Default: 120000 (2 minutes)
# Tags: database
# Type: integer
db.pool.keepalive.time=120000

# Amount of time (ms) a connection can be out of the pool before a message is logged indicating a possible
# connection leak (HikariCP only).
#
# A value of 0 disables leak detection. The minimum allowed value for enabling leak detection is 2000 ms (2 seconds).
# Default: 0 (disabled).
# Tags: database
# Type: integer
db.pool.leak.detection.threshold=0

# The initial size of the connection pool
# Tags: database
# Type: integer
db.pool.initial.size=5

# The maximum number of connections in the pool. This is the upper bound on open database connections
# regardless of which pool is in use. The http.concurrent.workers.max value should be less than half
# of this value.
#
# Note: the semantic differs slightly by pool type:
#   DBCP2:   caps active (borrowed) connections only; idle connections are managed separately by db.pool.max.idle.
#   HikariCP: caps the total pool size (active + idle combined); db.pool.max.idle is ignored.
# Tags: database
# Type: integer
db.pool.max.active=50

# The maximum number of connections that can remain idle in the pool, without extra ones
# being released
# Tags: database
# Type: integer
db.pool.max.idle=20

# The minimum number of idle connections to maintain in the pool.
#
# Note: the behavior differs by pool type:
#   DBCP2:   the eviction thread creates new connections to keep the idle count at or above this value.
#   HikariCP: when set to a positive value, HikariCP makes a best effort to maintain that many idle connections
#             while the total pool size remains below db.pool.max.active. At 0 the pool is fully
#             elastic: it creates connections on demand and reclaims them once idle for db.pool.idle.timeout.millis setting.
#             Note: For high-throughput sync workloads, HikariCP recommends setting this equal to db.pool.max.active
#             to keep the pool warm and avoid connection-creation latency on every burst. Per HikariCP's documentation,
#			  pairing this with an idleTimeout and maxLifetime shorter than the database's own connection timeout is
#			  recommended to avoid stale-connection leaks.
# Tags: database
# Type: integer
db.pool.min.idle=5

# SQL query executed just before a connection is given to the caller to verify the connection is still alive.
# Also known as connectionTestQuery in HikariCP.
#
# HikariCP: Hikari recommends to only set this for legacy JDBC drivers that do not support the JDBC 4
# Connection.isValid() API. If your driver is JDBC 4 compliant, leave this unset and HikariCP will use
# isValid() automatically. HikariCP will log an error at startup if the driver is not JDBC 4 compliant.
#
# This setting is database specific. The following are example statements for common databases:
#
# MySQL
#  db.validation.query=select 1
# Oracle
#  db.validation.query=select 1 from dual
# DB2
#  db.validation.query=select max(1) from syscat.datatypes
# Tags: database
db.validation.query=

# These are settings that will be passed to the JDBC driver as connection properties.
# Suggested settings by database are as follows:
# Oracle
#
#  db.connection.properties=oracle.net.CONNECT_TIMEOUT=300000;oracle.jdbc.ReadTimeout=300000;SetBigStringTryClob=true
# Tags: database
db.connection.properties=

# Specify one or more SQL statements that will be run when a database connection is created.
# Multiple SQL statements must be separated by semicolons. If a statement has a semicolon in
# the value, then put two semicolons in its place to allow the specification of keeping the
# semicolon in the value. For example:
# db.init.sql=SET OPTION 'host=localhost;;user=user1;;password=pwd1';SET OPTION TWO
# This will be split into two statements that are sent to the database server:
# SET OPTION 'host=localhost;user=user1;password=pwd1'
# SET OPTION TWO
#
# Tags: database
db.init.sql=

