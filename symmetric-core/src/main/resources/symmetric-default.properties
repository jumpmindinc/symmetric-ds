send.ack.keepalive.ms=30000

# This is the amount of time to wait between trying to send an ACK back to the remote node
# when pulling and loading data.
#
# DatabaseOverridable: true
# Tags: transport
# Type: integer
time.between.ack.retries.ms=5000

# Determines how long a node will wait for network request to be completed successfully (including a response). Sets the read timeout on the internal HttpUrlConnection. 
# Increasing the value of this parameter might help remote nodes which have poor network connectivity (congestion, dropped packets, low transfer rate, slow DNS lookups, etc.).
# Too low value will not allow for network to do its job and deliver intended payload or batch, resulting in significant delays.
# Consider using the bin/symconsole cluster-test command to report network latency and help diagnose connectivity issues.
#
# DatabaseOverridable: true
# Tags: transport
# Type: integer
http.timeout.ms=90000

# Determines how long a node will wait for network connection to be established successfully. Sets the connection timeout on the internal HttpUrlConnection
# Increasing the value of this parameter might help remote nodes which have poor network connectivity (congestion, protocol version negotiation, proxy authentication, DLP, dropped packets, low transfer rate, slow DNS lookups, etc.).
# Too low value will not allow for network infrastructure to do its job and establish a connection, resulting in significant delays.
# Do not confuse with the http.timeout.ms, which sets timeout for the entire network round-trip.
# Consider using the bin/symconsole cluster-test command to report network latency and help diagnose connectivity issues.
#
# DatabaseOverridable: true
# Tags: transport
# Type: integer
http.connect.timeout.ms=90000

