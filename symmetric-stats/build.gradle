apply from: symAssembleDir + '/common.gradle'

    description = 'SymmetricDS statistics and observability implementation.'

    dependencies {
        api project(':symmetric-core')
        api platform("io.opentelemetry:opentelemetry-bom:$openTelemetryVersion")
        api "io.opentelemetry:opentelemetry-api:$openTelemetryVersion"
        implementation "io.opentelemetry:opentelemetry-sdk:$openTelemetryVersion"
        implementation "io.opentelemetry:opentelemetry-sdk-extension-autoconfigure:$openTelemetryVersion"
        api "org.apache.commons:commons-lang3:$commonsLangVersion"
        testImplementation "io.opentelemetry:opentelemetry-sdk-testing:$openTelemetryVersion"
        testImplementation project(path: ':symmetric-core', configuration: 'testArtifacts')
    }
