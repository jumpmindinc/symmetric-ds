apply plugin: 'org.asciidoctor.jvm.convert'

configurations{ 
	generateAppendixesDependencies
	generateReleaseNotesDependencies	
}

dependencies {
    generateAppendixesDependencies project(":symmetric-util")
    generateAppendixesDependencies project(":symmetric-db")
    generateReleaseNotesDependencies project(":symmetric-util")
    generateReleaseNotesDependencies project(":symmetric-db")
}

def previousDocsVersion = latestPreviousVersion
def docJarsDir = file(symAssembleDir + '/build/docJars')
def saturnMavenUrl = (findProperty('saturnUrl') ?: 'https://downloads.jumpmind.com').toString().replaceAll('/+$', '') + '/files/maven/releases'
def previousCoreJarPath = "org/jumpmind/symmetric/symmetric-core/${previousDocsVersion}/symmetric-core-${previousDocsVersion}.jar"
def proRepositoryDir = file(symAssembleDir + '/../../symmetric-pro')

def downloadZip = { String url, File target ->
    try {
        def connection = new URL(url).openConnection()
        connection.connectTimeout = 30000
        connection.readTimeout = 120000
        if (connection instanceof HttpURLConnection && connection.responseCode != 200) {
            return false
        }
        byte[] bytes = connection.inputStream.withCloseable { it.bytes }
        if (bytes.length < 4 || bytes[0] != (byte) 0x50 || bytes[1] != (byte) 0x4B) {
            return false
        }
        target.bytes = bytes
        return true
    } catch (IOException e) {
        return false
    }
}

def proGit = { List<String> arguments ->
    def process = new ProcessBuilder(['git', '-C', proRepositoryDir.path] + arguments).start()
    byte[] output = process.inputStream.bytes
    process.errorStream.text
    return process.waitFor() == 0 ? output : null
}

task downloadJars {
    doFirst {
        docJarsDir.mkdirs()
        def coreZip = new File(docJarsDir, "download-core-${previousDocsVersion}.zip")
        def coreSources = ["${saturnMavenUrl}/${previousCoreJarPath}", "https://repo1.maven.org/maven2/${previousCoreJarPath}"]
        def coreSource = coreSources.find { url -> downloadZip(url.toString(), coreZip) }
        if (coreSource == null) {
            throw new GradleException("symmetric-core ${previousDocsVersion} is missing from ${coreSources}")
        }
        logger.lifecycle("Release notes compare against symmetric-core ${previousDocsVersion} from ${coreSource}")

        def proDir = new File(docJarsDir, "pro-${previousDocsVersion}")
        proDir.mkdirs()
        if (!new File(proRepositoryDir, '.git').exists()) {
            logger.lifecycle("No symmetric-pro checkout at ${proRepositoryDir}: release notes cover the open-source parameters and tables only")
            return
        }
        def tagRef = "refs/tags/${previousDocsVersion}".toString()
        if (proGit(['rev-parse', '--verify', '--quiet', tagRef]) == null) {
            proGit(['fetch', '--quiet', '--no-tags', 'origin', "${tagRef}:${tagRef}".toString()])
        }
        ['symmetric-console-default.properties', 'console-schema.xml'].each { name ->
            byte[] content = proGit(['show', "${tagRef}:symmetric-pro/src/main/resources/${name}".toString()])
            if (content == null) {
                throw new GradleException("symmetric-pro tag ${previousDocsVersion} lacks symmetric-pro/src/main/resources/${name}; fetch the tag into ${proRepositoryDir}")
            }
            new File(proDir, name).bytes = content
        }
        logger.lifecycle("Release notes compare against symmetric-pro ${previousDocsVersion} from git tag ${previousDocsVersion}")
    }
}
task unzipCoreJar(type: Copy) {
	dependsOn downloadJars
		def zipFile1 = file(symAssembleDir + '/build/docJars/download-core-' + latestPreviousVersion + '.zip')
		def outputDir1 = file(symAssembleDir + '/build/docJars/core-' + latestPreviousVersion)
		from zipTree(zipFile1)
		into outputDir1	
}

// downloadJars now writes the previous pro files straight into build/docJars/pro-<version>; the task name stays for its dependents.
task unzipProJar {
	dependsOn unzipCoreJar
}

task generateReleaseNotesActual(type: JavaExec) {
	dependsOn unzipProJar
	mainClass = 'org.jumpmind.db.io.ReleaseNotesGenerator'
	classpath = configurations.generateReleaseNotesDependencies
	args = [
		symAssembleDir + '/build/docJars/core-' + latestPreviousVersion + "/symmetric-default.properties",
		symAssembleDir + '/build/docJars/core-' + latestPreviousVersion + "/symmetric-schema.xml",
		symAssembleDir + '/build/docJars/pro-' + latestPreviousVersion + "/symmetric-console-default.properties",
		symAssembleDir + '/build/docJars/pro-' + latestPreviousVersion + "/console-schema.xml",
		symAssembleDir + '/src/asciidoc/generated/release-notes.ad',
		majorMinorVersion,
		"https://jumpmind.atlassian.net"
	]
}

task generateReleaseNotes {
	dependsOn unzipProJar
	dependsOn project(":symmetric-util").jar
	dependsOn project(":symmetric-db").jar
	dependsOn generateReleaseNotesActual
}

task generateServerParameters(type: JavaExec) {
	mainClass = 'org.jumpmind.properties.DefaultParameterParser'
    classpath = configurations.generateAppendixesDependencies
    args = [
        symAssembleDir + '/../symmetric-server/src/main/deploy/conf/symmetric-server.properties',
        symAssembleDir + '/src/asciidoc/generated/server-parameters.ad',
        'false',
        'asciidoc'
    ]
}

task generateStartupParametersPro(type: JavaExec) {
	mainClass = 'org.jumpmind.properties.DefaultParameterParser'
	classpath = configurations.generateAppendixesDependencies
	args = [
		symAssembleDir + '/../symmetric-core/src/main/resources/symmetric-default.properties,' + symAssembleDir + '/../../symmetric-pro/symmetric-pro/src/main/resources/symmetric-console-default.properties',
		symAssembleDir + '/src/asciidoc/generated/startup-parameters.ad',
		'false',
		'asciidoc'        		
	]
}

task generateRuntimeParametersPro(type: JavaExec) {
	mainClass = 'org.jumpmind.properties.DefaultParameterParser'
	classpath = configurations.generateAppendixesDependencies
	args = [
		symAssembleDir + '/../symmetric-core/src/main/resources/symmetric-default.properties,' + symAssembleDir + '/../../symmetric-pro/symmetric-pro/src/main/resources/symmetric-console-default.properties',
		symAssembleDir + '/src/asciidoc/generated/runtime-parameters.ad',
		'true',
		'asciidoc'        		
	]
}

task generateSchemaPro(type: JavaExec) {
	mainClass = 'org.jumpmind.db.io.DatabaseXmlAsciiDocBuilder'
    classpath = configurations.generateAppendixesDependencies
    args = [
        symAssembleDir + '/../symmetric-core/src/main/resources/symmetric-schema.xml,' + symAssembleDir + '/../../symmetric-pro/symmetric-pro/src/main/resources/console-schema.xml',
        symAssembleDir + '/src/asciidoc/generated/schema.ad'
    ]
}

task generateStartupParameters(type: JavaExec) {
	mainClass = 'org.jumpmind.properties.DefaultParameterParser'
	classpath = configurations.generateAppendixesDependencies
	args = [
    	symAssembleDir + '/../symmetric-core/src/main/resources/symmetric-default.properties',
   		symAssembleDir + '/src/asciidoc/generated/startup-parameters.ad',
    	'false',
    	'asciidoc'
	]
}

task generateRuntimeParameters(type: JavaExec) {
	mainClass = 'org.jumpmind.properties.DefaultParameterParser'
	classpath = configurations.generateAppendixesDependencies
	args = [
 	    symAssembleDir + '/../symmetric-core/src/main/resources/symmetric-default.properties',
 	    symAssembleDir + '/src/asciidoc/generated/runtime-parameters.ad',
 	    'true',
	    'asciidoc'
 	]
}

task generateSchema(type: JavaExec) {
	mainClass = 'org.jumpmind.db.io.DatabaseXmlAsciiDocBuilder'
    classpath = configurations.generateAppendixesDependencies
    args = [
        symAssembleDir + '/../symmetric-core/src/main/resources/symmetric-schema.xml',
        symAssembleDir + '/src/asciidoc/generated/schema.ad'
    ]
}

task generateAppendixes {
    dependsOn project(":symmetric-db").jar
    dependsOn generateServerParameters
    if (project.properties.containsKey('pro')) {
    	dependsOn generateStartupParametersPro
    	dependsOn generateRuntimeParametersPro
    	dependsOn generateSchemaPro
    } else {
    	dependsOn generateStartupParameters
    	dependsOn generateRuntimeParameters
    	dependsOn generateSchema
    }
}

ext.getDocDir = {
    return file("$buildDir/doc")
}

task cleanDocs {
    dependsOn asciidoctor
    def destinationDir = getDocDir()
    doFirst {
        println "Deleting $destinationDir.path"
        delete destinationDir
    }
}

task generateDocs(type: Copy) {
    
    dependsOn cleanDocs
	group = 'SymmetricDS'
	description = 'Generates user manual and documentation'
    
    destinationDir = getDocDir()

	into('html') {
		from ("$buildDir/src/asciidoc/html5/generated") { include "release-notes.html" }
        filter(org.apache.tools.ant.filters.ReplaceTokens, tokens: [
            'appVersion': version,
            'appMajorVersion': majorMinorVersion,
            'buildTime': new java.text.SimpleDateFormat('yyyy-MM-dd HH:mm:ss').format(new java.util.Date()),
            'buildYear': new java.text.SimpleDateFormat('yyyy').format(new java.util.Date()),
            'scmVersion' : scmVersion
        ])
    }
    
    into('html') {
        from ("$buildDir/src/asciidoc/html5") { include "user-guide.html" }
        filter(org.apache.tools.ant.filters.ReplaceTokens, tokens: [
            'appVersion': version,
            'appMajorVersion': majorMinorVersion,
            'buildTime': new java.text.SimpleDateFormat('yyyy-MM-dd HH:mm:ss').format(new java.util.Date()),
            'buildYear': new java.text.SimpleDateFormat('yyyy').format(new java.util.Date()),
            'scmVersion' : scmVersion
        ])
    }
    
    if (!project.properties.containsKey('pro')) {
        into('html') {
            from ("$buildDir/src/asciidoc/html5/tutorials") { include "tutorials.html" }
            filter(org.apache.tools.ant.filters.ReplaceTokens, tokens: [
                'appVersion': version,
                'appMajorVersion': majorMinorVersion,
                'buildTime': new java.text.SimpleDateFormat('yyyy-MM-dd HH:mm:ss').format(new java.util.Date()),
                'buildYear': new java.text.SimpleDateFormat('yyyy').format(new java.util.Date()),
                'scmVersion' : scmVersion
            ])
        }
    }
        
    into('html') {
        from ("$buildDir/src/asciidoc/html5/operations") { include "operations.html" }
        filter(org.apache.tools.ant.filters.ReplaceTokens, tokens: [
            'appVersion': version,
            'appMajorVersion': majorMinorVersion,
            'buildTime': new java.text.SimpleDateFormat('yyyy-MM-dd HH:mm:ss').format(new java.util.Date()),
            'buildYear': new java.text.SimpleDateFormat('yyyy').format(new java.util.Date()),
            'scmVersion' : scmVersion
        ])
        
    }

    into('pdf') {
        from ("$buildDir/src/asciidoc/pdf") { include "user-guide.pdf" }
    }

    if (!project.properties.containsKey('pro')) {
        into('pdf') {
            from ("$buildDir/src/asciidoc/pdf/tutorials") { include "tutorials.pdf" }
        }
    }

    into('pdf') {
        from ("$buildDir/src/asciidoc/pdf/operations") { include "operations.pdf" }
    }    

}


task publishDoc {
    dependsOn generateDocs
	group = 'SymmetricDS'
	description = 'Publish online documentation to SourceForge website'
    doLast {
        ant.taskdef(name: 'scp', classname: 'org.apache.tools.ant.taskdefs.optional.ssh.Scp',
        classpath: configurations.sshAntTask.asPath)

        ant.scp(
            todir: "$sourceforgeUser:$sourceforgePassword@web.sourceforge.net:/home/project-web/symmetricds/htdocs/doc/$majorMinorVersion",
            trust: 'true',
            verbose: 'true') {
            fileset(dir: "$buildDir/doc") { include(name: '**/**')
            }
        }
    }
}

asciidoctor { (1)
	baseDirFollowsSourceDir()
    sourceDir = file(symAssembleDir + '/src/asciidoc')
    outputDir = file("$buildDir/src/asciidoc/" + docFormat)
	outputOptions {
        backends docFormat
    }
    options = [
        doctype: 'book',
        sourceDocumentNames: [
        	symAssembleDir + 'generated/release-notes.ad',
            symAssembleDir + 'user-guide.ad',
            symAssembleDir + 'tutorials/tutorials.ad',
            symAssembleDir + 'operations/operations.ad']
    ]    
    attributes \
        'source-highlighter':'coderay',
        'data-uri':'true'
    
    if (project.properties.containsKey('pro')) {
       attributes 'pro':'true'
    }     
}

asciidoctor.dependsOn { tasks.generateAppendixes }
asciidoctor.dependsOn { tasks.generateReleaseNotes }
