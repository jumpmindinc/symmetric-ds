apply plugin: 'org.asciidoctor.jvm.convert'

configurations{ 
	generateAppendixesDependencies
	generateReleaseNotesDependencies	
}

dependencies {
    generateAppendixesDependencies project(":symmetric-util")
    generateAppendixesDependencies project(":symmetric-db")
    generateReleaseNotesDependencies project(":symmetric-util")
    generateReleaseNotesDependencies project(":symmetric-db")
}

def previousReleaseDir = file(symAssembleDir + '/build/previous-release')
def coreRepositoryDir = file(symAssembleDir + '/..')
def proRepositoryDir = file(symAssembleDir + '/../../symmetric-pro')

def runGit = { File repositoryDir, List<String> arguments ->
    def process = new ProcessBuilder(['git', '-C', repositoryDir.path] + arguments).start()
    def errorText = new StringBuilder()
    def errorReader = Thread.start { errorText.append(process.errorStream.text) }
    byte[] output = process.inputStream.bytes
    int exitCode = process.waitFor()
    errorReader.join()
    return [isSuccess: exitCode == 0, output: output, error: errorText.toString().trim()]
}

def releaseVersionPattern = ~/\d+(\.\d+)+/

// "x" in 3.18.x sorts above every number, so 3.18.x-SNAPSHOT compares after every 3.18 release.
def toVersionParts = { String releaseVersion ->
    releaseVersion.tokenize('.').collect { part -> part == 'x' ? Integer.MAX_VALUE : part.toInteger() }
}

def compareVersions = { String left, String right ->
    def leftParts = toVersionParts(left)
    def rightParts = toVersionParts(right)
    for (int i = 0; i < Math.max(leftParts.size(), rightParts.size()); i++) {
        int difference = (i < leftParts.size() ? leftParts[i] : 0) <=> (i < rightParts.size() ? rightParts[i] : 0)
        if (difference != 0) {
            return difference
        }
    }
    return 0
}

def toReleaseVersion = { String buildVersion ->
    buildVersion.replaceFirst(/-SNAPSHOT$/, '').replaceFirst(/(?i)\.RC\d+$/, '')
}

def listReleaseTags = { File repositoryDir ->
    def remoteTags = runGit(repositoryDir, ['ls-remote', '--tags', '--refs', 'origin'])
    List<String> tagNames
    if (remoteTags.isSuccess) {
        tagNames = new String(remoteTags.output).readLines().collect { line -> line.replaceFirst(/^.*refs\/tags\//, '') }
    } else {
        logger.warn("Cannot list the tags of origin in ${repositoryDir}, using the local tags: ${remoteTags.error}")
        tagNames = new String(runGit(repositoryDir, ['tag', '--list']).output).readLines()
    }
    return tagNames.findAll { tagName -> tagName ==~ releaseVersionPattern }
}

def findPreviousReleaseVersion = {
    def overrideVersion = findProperty('latestPreviousVersion')
    if (overrideVersion) {
        return overrideVersion.toString()
    }
    def releaseVersion = toReleaseVersion(project.version.toString())
    def previousVersion = listReleaseTags(coreRepositoryDir)
            .findAll { tagName -> compareVersions(tagName, releaseVersion) < 0 }
            .max { left, right -> compareVersions(left, right) }
    if (previousVersion == null) {
        throw new GradleException("symmetric-ds has no release tag below ${releaseVersion}; pass -PlatestPreviousVersion=<version>")
    }
    return previousVersion
}

def copyFilesFromReleaseTag = { File repositoryDir, String releaseVersion, String sourceDir, List<String> fileNames ->
    def releaseTag = "refs/tags/${releaseVersion}".toString()
    if (!runGit(repositoryDir, ['rev-parse', '--verify', '--quiet', releaseTag]).isSuccess) {
        def fetchArguments = ['fetch', '--quiet', '--no-tags']
        // A shallow CI checkout needs only the tagged commit; a full clone keeps its full history.
        if (new String(runGit(repositoryDir, ['rev-parse', '--is-shallow-repository']).output).trim() == 'true') {
            fetchArguments << '--depth=1'
        }
        def fetch = runGit(repositoryDir, fetchArguments + ['origin', "${releaseTag}:${releaseTag}".toString()])
        if (!fetch.isSuccess) {
            throw new GradleException("Cannot fetch tag ${releaseVersion} into ${repositoryDir}: ${fetch.error}")
        }
    }
    fileNames.each { fileName ->
        def show = runGit(repositoryDir, ['show', "${releaseTag}:${sourceDir}/${fileName}".toString()])
        if (!show.isSuccess) {
            throw new GradleException("Tag ${releaseVersion} in ${repositoryDir} lacks ${sourceDir}/${fileName}: ${show.error}")
        }
        new File(previousReleaseDir, fileName).bytes = show.output
    }
}

task copyPreviousReleaseFiles {
    group = 'documentation'
    description = 'Copies the parameter and schema files of the previous release from its git tag, for the release notes to compare against. -PlatestPreviousVersion=<version> picks the release.'
    doLast {
        def previousVersion = findPreviousReleaseVersion()
        project.delete(previousReleaseDir)
        previousReleaseDir.mkdirs()
        copyFilesFromReleaseTag(coreRepositoryDir, previousVersion, 'symmetric-core/src/main/resources',
                ['symmetric-default.properties', 'symmetric-schema.xml'])
        if (new File(proRepositoryDir, '.git').exists()) {
            copyFilesFromReleaseTag(proRepositoryDir, previousVersion, 'symmetric-pro/src/main/resources',
                    ['symmetric-console-default.properties', 'console-schema.xml'])
            logger.lifecycle("Release notes for ${project.version} compare against symmetric-ds and symmetric-pro ${previousVersion} from their git tags")
        } else {
            logger.lifecycle("Release notes for ${project.version} compare against symmetric-ds ${previousVersion} from its git tag; no symmetric-pro checkout at ${proRepositoryDir}, so they cover the open-source parameters and tables only")
        }
    }
}

task generateReleaseNotesActual(type: JavaExec) {
	dependsOn copyPreviousReleaseFiles
	mainClass = 'org.jumpmind.db.io.ReleaseNotesGenerator'
	classpath = configurations.generateReleaseNotesDependencies
	args = [
		"${previousReleaseDir}/symmetric-default.properties",
		"${previousReleaseDir}/symmetric-schema.xml",
		"${previousReleaseDir}/symmetric-console-default.properties",
		"${previousReleaseDir}/console-schema.xml",
		symAssembleDir + '/src/asciidoc/generated/release-notes.ad',
		majorMinorVersion,
		"https://jumpmind.atlassian.net"
	]
}

task generateReleaseNotes {
	dependsOn project(":symmetric-util").jar
	dependsOn project(":symmetric-db").jar
	dependsOn generateReleaseNotesActual
}

task generateAppendixes {
    dependsOn project(":symmetric-db").jar
    doLast{
        javaexec {
            mainClass = 'org.jumpmind.properties.DefaultParameterParser'
            classpath = configurations.generateAppendixesDependencies
            args = [
                symAssembleDir + '/../symmetric-server/src/main/deploy/conf/symmetric-server.properties',
                symAssembleDir + '/src/asciidoc/generated/server-parameters.ad',
                'false',
                'asciidoc'
            ]
        }

        if (project.properties.containsKey('pro')) {
        	javaexec {
        		mainClass = 'org.jumpmind.properties.DefaultParameterParser'
        		classpath = configurations.generateAppendixesDependencies
        		args = [
					symAssembleDir + '/../symmetric-core/src/main/resources/symmetric-default.properties,' + symAssembleDir + '/../../symmetric-pro/symmetric-pro/src/main/resources/symmetric-console-default.properties',
					symAssembleDir + '/src/asciidoc/generated/startup-parameters.ad',
					'false',
					'asciidoc'        		
        		]
        	}
        	
        	javaexec {
        		mainClass = 'org.jumpmind.properties.DefaultParameterParser'
        		classpath = configurations.generateAppendixesDependencies
        		args = [
					symAssembleDir + '/../symmetric-core/src/main/resources/symmetric-default.properties,' + symAssembleDir + '/../../symmetric-pro/symmetric-pro/src/main/resources/symmetric-console-default.properties',
					symAssembleDir + '/src/asciidoc/generated/runtime-parameters.ad',
					'true',
					'asciidoc'        		
        		]
        	}
        	
	        javaexec {
	            mainClass = 'org.jumpmind.db.io.DatabaseXmlAsciiDocBuilder'
	            classpath = configurations.generateAppendixesDependencies
	            args = [
	                symAssembleDir + '/../symmetric-core/src/main/resources/symmetric-schema.xml,' + symAssembleDir + '/../../symmetric-pro/symmetric-pro/src/main/resources/console-schema.xml',
	                symAssembleDir + '/src/asciidoc/generated/schema.ad'
	            ]
	        }
        } else {
        	javaexec {
            	mainClass = 'org.jumpmind.properties.DefaultParameterParser'
            	classpath = configurations.generateAppendixesDependencies
            	args = [
                	symAssembleDir + '/../symmetric-core/src/main/resources/symmetric-default.properties',
               		symAssembleDir + '/src/asciidoc/generated/startup-parameters.ad',
                	'false',
                	'asciidoc'
            	]
        	}

        	javaexec {
            	mainClass = 'org.jumpmind.properties.DefaultParameterParser'
            	classpath = configurations.generateAppendixesDependencies
            	args = [
             	    symAssembleDir + '/../symmetric-core/src/main/resources/symmetric-default.properties',
             	    symAssembleDir + '/src/asciidoc/generated/runtime-parameters.ad',
             	    'true',
            	    'asciidoc'
           	 	]
       		}
       		
	        javaexec {
	            mainClass = 'org.jumpmind.db.io.DatabaseXmlAsciiDocBuilder'
	            classpath = configurations.generateAppendixesDependencies
	            args = [
	                symAssembleDir + '/../symmetric-core/src/main/resources/symmetric-schema.xml',
	                symAssembleDir + '/src/asciidoc/generated/schema.ad'
	            ]
	        }
        }

    }
}

ext.getDocDir = {
    return file("$buildDir/doc")
}

task cleanDocs {
    dependsOn asciidoctor
    def destinationDir = getDocDir()
    doFirst {
        println "Deleting $destinationDir.path"
        delete destinationDir
    }
}

task generateDocs(type: Copy) {
    
    dependsOn cleanDocs
	group = 'SymmetricDS'
	description = 'Generates user manual and documentation'
    
    destinationDir = getDocDir()

	into('html') {
		from ("$buildDir/src/asciidoc/html5/generated") { include "release-notes.html" }
        filter(org.apache.tools.ant.filters.ReplaceTokens, tokens: [
            'appVersion': version,
            'appMajorVersion': majorMinorVersion,
            'buildTime': new java.text.SimpleDateFormat('yyyy-MM-dd HH:mm:ss').format(new java.util.Date()),
            'buildYear': new java.text.SimpleDateFormat('yyyy').format(new java.util.Date()),
            'scmVersion' : scmVersion
        ])
    }
    
    into('html') {
        from ("$buildDir/src/asciidoc/html5") { include "user-guide.html" }
        filter(org.apache.tools.ant.filters.ReplaceTokens, tokens: [
            'appVersion': version,
            'appMajorVersion': majorMinorVersion,
            'buildTime': new java.text.SimpleDateFormat('yyyy-MM-dd HH:mm:ss').format(new java.util.Date()),
            'buildYear': new java.text.SimpleDateFormat('yyyy').format(new java.util.Date()),
            'scmVersion' : scmVersion
        ])
    }
    
    if (!project.properties.containsKey('pro')) {
        into('html') {
            from ("$buildDir/src/asciidoc/html5/tutorials") { include "tutorials.html" }
            filter(org.apache.tools.ant.filters.ReplaceTokens, tokens: [
                'appVersion': version,
                'appMajorVersion': majorMinorVersion,
                'buildTime': new java.text.SimpleDateFormat('yyyy-MM-dd HH:mm:ss').format(new java.util.Date()),
                'buildYear': new java.text.SimpleDateFormat('yyyy').format(new java.util.Date()),
                'scmVersion' : scmVersion
            ])
        }
    }
        
    into('html') {
        from ("$buildDir/src/asciidoc/html5/operations") { include "operations.html" }
        filter(org.apache.tools.ant.filters.ReplaceTokens, tokens: [
            'appVersion': version,
            'appMajorVersion': majorMinorVersion,
            'buildTime': new java.text.SimpleDateFormat('yyyy-MM-dd HH:mm:ss').format(new java.util.Date()),
            'buildYear': new java.text.SimpleDateFormat('yyyy').format(new java.util.Date()),
            'scmVersion' : scmVersion
        ])
        
    }

    into('pdf') {
        from ("$buildDir/src/asciidoc/pdf") { include "user-guide.pdf" }
    }

    if (!project.properties.containsKey('pro')) {
        into('pdf') {
            from ("$buildDir/src/asciidoc/pdf/tutorials") { include "tutorials.pdf" }
        }
    }

    into('pdf') {
        from ("$buildDir/src/asciidoc/pdf/operations") { include "operations.pdf" }
    }    

}


task publishDoc {
    dependsOn generateDocs
	group = 'SymmetricDS'
	description = 'Publish online documentation to SourceForge website'
    doLast {
        ant.taskdef(name: 'scp', classname: 'org.apache.tools.ant.taskdefs.optional.ssh.Scp',
        classpath: configurations.sshAntTask.asPath)

        ant.scp(
            todir: "$sourceforgeUser:$sourceforgePassword@web.sourceforge.net:/home/project-web/symmetricds/htdocs/doc/$majorMinorVersion",
            trust: 'true',
            verbose: 'true') {
            fileset(dir: "$buildDir/doc") { include(name: '**/**')
            }
        }
    }
}

asciidoctor { (1)
	baseDirFollowsSourceDir()
    sourceDir = file(symAssembleDir + '/src/asciidoc')
    outputDir = file("$buildDir/src/asciidoc/" + docFormat)
	outputOptions {
        backends docFormat
    }
    options = [
        doctype: 'book',
        sourceDocumentNames: [
        	symAssembleDir + 'generated/release-notes.ad',
            symAssembleDir + 'user-guide.ad',
            symAssembleDir + 'tutorials/tutorials.ad',
            symAssembleDir + 'operations/operations.ad']
    ]    
    attributes \
        'source-highlighter':'coderay',
        'data-uri':'true'
    
    if (project.properties.containsKey('pro')) {
       attributes 'pro':'true'
    }     
}

asciidoctor.dependsOn { tasks.generateAppendixes }
asciidoctor.dependsOn { tasks.generateReleaseNotes }
