        mssqlVersion = '13.4.0.jre11'
        jakartaMailVersion = '2.0.4'
        jdomVersion = '2.0.6.1'
        jaxbVersion = '4.0.5'
        gsonVersion = '2.13.1'
        jacksonVersion = '3.1.3'
        guavaVersion = '33.2.0-android'
        junitVersion = '5.13.3'
        spotBugsVersion = '4.8.5'
        logbackVersion = '1.5.32'
        slf4jVersion = '2.0.17'
        mockitoVersion = '5.11.0'
        powerMockVersion = '2.0.9'
        mysqlVersion = '8.4.0'
        servletVersion = '4.0.1'
        springVersion = '7.0.9'
        springDataVersion = '4.0.6'
        springBootVersion = '4.1.1'
        jtdsVersion = '1.3.1'
        bouncyCastleVersion = '1.84'
        animalSnifferVersion = '1.23'
        jnaVersion = '5.14.0'
        jettyVersion = '12.1.12'
        websocketVersion = '2.2.0'
        openTelemetryVersion = '1.61.0'
        env = System.getenv()
    }

    dependencies {
        api "ch.qos.logback:logback-classic:$logbackVersion"
        api "ch.qos.logback:logback-core:$logbackVersion"
        api "org.slf4j:slf4j-api:$slf4jVersion"
        api "org.slf4j:jul-to-slf4j:$slf4jVersion"
        api "org.slf4j:jcl-over-slf4j:$slf4jVersion"
        compileOnly "com.github.spotbugs:spotbugs-annotations:$spotBugsVersion"

        testImplementation fileTree(dir: System.getProperty("user.home") + '/.symmetricds/lib', include: '*.jar')
        testImplementation "org.junit.jupiter:junit-jupiter:$junitVersion"
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
    	testRuntimeOnly 'org.junit.platform:junit-platform-engine:1.12.2'
        
        testImplementation "org.hamcrest:hamcrest-all:$hamcrestVersion"
        testImplementation "org.mockito:mockito-core:$mockitoVersion"
        testImplementation "org.powermock:powermock-api-mockito2:$powerMockVersion"
        testImplementation "org.powermock:powermock-module-junit4:$powerMockVersion"
        
        deployerJars "org.apache.maven.wagon:wagon-ssh:3.5.3"
    }    

    task develop {
        dependsOn tasks.cleanEclipse, tasks.eclipse, tasks.cleanIdea, tasks.idea, tasks.compileTestJava
        
        doLast {
            def wstFacetXml = "$projectDir/.settings/org.eclipse.wst.common.project.facet.core.xml"
            println "Deleting $wstFacetXml"
            delete wstFacetXml 
        }
    }
}
