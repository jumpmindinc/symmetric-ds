        bshVersion = '2.0b6'
        commonsBeanUtilsVersion = '1.11.0'
        commonsCliVersion = '1.6.0'
        commonsDbcpVersion = '2.13.0'
        commonsFileuploadVersion = '2.0.0-M4'
        commonsIoVersion = '2.19.0'
        commonsLangVersion = '3.18.0'
        commonsTextVersion = '1.12.0'
        commonsCodecVersion = '1.16.1'
        commonsJcsVersion = '3.2.1'
        commonsCollectionVersion = '4.5.0-M3'
        commonsVfs = '2.10.0'
        hamcrestVersion = '1.3'
        hikariVersion = '7.0.2'
        h2Version = '2.4.240'
        derbyVersion = '10.16.1.1'
        postgresqlVersion =  '42.7.13'
        hsqldbVersion = '2.7.0'
